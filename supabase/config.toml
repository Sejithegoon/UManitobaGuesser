# Supabase CLI configuration (local development only).
# Remote project settings live in the Supabase dashboard; see docs/backend/setup.md.
# Unlisted settings use the CLI defaults. If the CLI asks to regenerate this
# file, run `supabase init` and copy the [db.seed] section back in.

project_id = "umanitoba-guesser"

[db.seed]
enabled = true
# Generated by supabase/scripts/import_locations.py (git-ignored: contains coordinates)
sql_paths = ["./seed/*.local.sql"]

[auth]
# Guests will be anonymous users (Phase 3+). Off until then.
enable_anonymous_sign_ins = false

# Edge Functions check the caller themselves (auth.getUser), which works with
# both legacy and new JWT signing keys, so the platform pre-check is off.
[functions.um-verify]
verify_jwt = false

[functions.delete-account]
verify_jwt = false
