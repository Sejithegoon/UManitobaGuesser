<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7269426922041265"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play | UManitoba Guesser</title>
    <link rel="shortcut icon" href="./assets/logo-main.webp" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/edb895a006.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./static/main.css">
    <link rel="stylesheet" href="./static/play.css">
    <meta name="google-adsense-account" content="ca-pub-7269426922041265">
</head>
<body>

    <div class="nav">
        <div class="logo">
            <a href="./index.html"><img src="./assets/logo-main.webp" alt="logo"></a>
        </div>
        <div class="links">
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./about us.html">About Us</a></li>
                <li><a class="accountButtons" href="#"><button>login</button></a></li>
            </ul>
        </div>
    </div>

    <div class="main">
        <div class="game-card">
            <h1 id="roundHeader">ROUND 1</h1>
            <h3 id="timer">00s</h4>
            
            <div class="gameLocation" id="gameLocation">
                <img src="./locations/location1.png" alt="location">
            </div>

            <div class="map-container">
                <div id="map"></div>
            </div>

            <div class="game-ui">
                <div class="gameButtons">
                    <button id="guessButton" class="primary-btn">guess</button>
                    <button id="restartButton" class="secondary-btn">restart</button>
                </div>
                <div class="score-badge">
                    <p id="scroe">score: 0 🦬</p>
                </div>

                
            </div>
        </div>
    </div>

    <div id="feedbackModal" class="modal hidden">
        <div class="modalContent">
            <span id="closeModal">&times;</span>
            <p id="feedbackMessage"></p>
        </div>
    </div>

    <footer>
        <div class="footer-container">
            <div class="cord">
                <h3>Join the Community 🌐</h3>
                <p>Connect via Discord to get the latest updates on <strong>UofM Campus Guesser</strong>.</p>
                <div class="cta-row">
                    <div class="discord-cta">
                        <a href="https://discord.gg/s3Sta8cj5B"><button class="discord-btn"><i class='fab fa-discord'></i> Discord</button></a>
                    </div>
                    <div class="instagram-cta">
                        <a href="https://www.instagram.com/umanitobaguesser/" target="_blank"><button class="instagram-btn"><i class="fa-brands fa-instagram"></i> Instagram</button></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 UofM Campus Guesser | Built by Bisons for Bisons 🦬</p>
            </div>
        </div>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./static/game.js"></script>
</body>
</html>
